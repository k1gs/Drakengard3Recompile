stages:
  - test

intake-tests:
  stage: test
  image: python:3.12-slim
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
  script:
    - python -m unittest discover -s tests -v
# Portable parser checks only. Windows runtime, Ghidra and game checks run locally.
# This job requires an available GitLab runner supporting container images.
